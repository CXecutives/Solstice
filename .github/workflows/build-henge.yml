# .github/workflows/build-henge.yml
#
# Solstice's only build: engine tests, Swift tests and/or the IPA, on GitHub-hosted macOS runners (no Mac needed).
# Every macOS job runs on the Xcode 27 image: the ordinary image (macos-26) passes the tests too, but its pool gave this
# repository one runner at a time and dropped a second job after 15 minutes unstarted.
# It runs only on demand and does just what the inputs ask; tools/check.sh and tools/check-all.sh start it.
# The parts run as parallel jobs, so a full check takes about as long as its slowest part.
#
# The IPA is signed ad hoc with Henge.personal.entitlements (free team: get-task-allow + increased memory
# limit); the sideloading tool re-signs it with the user's certificate on install.

name: Build Solstice

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Engine tests to run: "all", "none", or names like "test_jit test_mem"'
        default: all
      ipa:
        description: Build the IPA
        type: boolean
        default: true
      san:
        description: Run the engine tests a second time with undefined-behaviour traps
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot
  HUSK_REF: "acfd7bcb6d1d2f6655a24e43d1d6f87cf142667a" # tag 3.4, pinned by commit
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

permissions:
  contents: read

jobs:
  # No "Henge" in what a person can see, no setting around core/knobs.def (python3 only: a free Linux runner, no macOS slot).
  brand:
    name: Brand gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tools/brand_gate.py
      # Every HV_ setting through core/knobs.def (no getenv("HV_ elsewhere, no name it lacks), and what is generated
      # (tools/regen.sh) as checked in.
      - name: Settings table and generated files
        run: |
          python3 tools/knobs.py --check
          bash tools/regen.sh
          git diff --exit-code

  engine:
    name: Engine tests
    if: inputs.tests != 'none'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Engine tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          xcrun clang --version | head -1
          [ "$TESTS" = all ] && TESTS=""
          # The app's engine bridge (henge-vm.c) with its network needs libslirp on the host, only for this test.
          case " $TESTS " in *" test_vm_lifecycle "*) brew install libslirp pkg-config ;; esac
          make -j4 core-test T="$TESTS"

  # Only in full and final checks (all tests, or with UB traps): a run for what a change touched stays at one job.
  shipped:
    name: Engine tests as shipped
    if: inputs.tests != 'none' && (inputs.tests == 'all' || inputs.san)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Engine tests with the app's settings (EngineTuning.swift) and ThinLTO
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          [ "$TESTS" = all ] && TESTS=""
          python3 tools/shipped_env.py
          env $(python3 tools/shipped_env.py) make -j4 core-test LTO=1 T="$TESTS"

  san:
    name: Engine tests with undefined-behaviour traps
    if: inputs.tests != 'none' && inputs.san
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Engine tests with undefined-behaviour traps
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          [ "$TESTS" = all ] && TESTS=""
          make -j4 core-test SAN=1 T="$TESTS"

  swift:
    name: Swift tests
    if: inputs.ipa
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift tests (pure logic, built for the Mac)
        run: make swift-test

  ios:
    name: iOS build
    if: inputs.ipa
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out Solstice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Henge

      - name: Toolchain
        run: |
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Check out Husk (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Leviidev/Husk
          ref: ${{ env.HUSK_REF }}
          path: Husk

      - name: Cache Husk's prebuilt iOS pieces
        id: husk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ env.HUSK_REF }}-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh', 'Husk/scripts/build_rppairing_ios.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen
          if [ "${{ steps.husk.outputs.cache-hit }}" != "true" ]; then
            brew install meson ninja pkg-config
            rustup target add aarch64-apple-ios || {
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              rustup target add aarch64-apple-ios
            }
          fi

      # Solstice needs only libffi, glib (with pcre2/intl) and libslirp from Husk, plus the pairing library.
      - name: Build Husk's iOS pieces
        if: steps.husk.outputs.cache-hit != 'true'
        working-directory: Husk
        run: |
          set -euxo pipefail
          bash scripts/fetch_sources.sh
          bash scripts/build_ios.sh libffi glib libslirp
          bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Solstice
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make -j4 ios-lib

      - name: SIMD gate
        working-directory: Henge
        run: python3 tools/simd_gate.py build/ios

      - name: Package Solstice.ipa
        working-directory: Henge
        env:
          SOLSTICE_BUILD: ${{ github.run_number }}
          HENGE_IPA_OUT: ${{ github.workspace }}/Solstice.ipa
        run: zsh ios/scripts/package_ipa.sh

      - name: Swift and Xcode warnings
        if: always()
        working-directory: Henge
        run: |
          log=ios/build/DerivedData.buildlog
          [ -f "$log" ] && grep -E "warning:" "$log" | sed 's/^.*\/Henge\///' | sort | uniq -c | sort -rn | head -40 || true

      - name: Upload Solstice.ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Solstice-ipa
          path: ${{ github.workspace }}/Solstice.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildlog
          path: Henge/ios/build/DerivedData.buildlog
          if-no-files-found: ignore

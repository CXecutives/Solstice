# The app for the simulator, only to photograph its screens with sample data (ios/scripts/screens.sh, tools/screens.sh).
# The same Swift and resources as the device app (project.yml), with the engine replaced by ios/Screens/henge-vm-stub.c
# and the preview entry (ios/Screens, SOLSTICE_SCREENS) added. No engine, restore stack, pairing library or JIT helper.
# The device build never reads this file.
name: Screens
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Screens:
    type: application
    platform: iOS
    sources:
      - path: Henge
        excludes:
          - "Resources/**"
          - "Info.plist"
          - "Henge.personal.entitlements"
          - "AppIcon.icon/**"
          - "AppIcon.icon"
          - "Native/*.c"
          - "Native/*.S"
      - path: Henge/Resources
        buildPhase: resources
      - path: Henge/AppIcon.icon
        type: file
        buildPhase: resources
      - path: HengeJITHelper/HengeJITMessages.swift
      - path: Screens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solstice.screens
        PRODUCT_NAME: Solstice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Henge/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Henge/HengeBridge.h
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SOLSTICE_SCREENS"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        CLANG_C_LANGUAGE_STANDARD: c11
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core"
          - "$(SRCROOT)/../host"
          - "$(SRCROOT)/../devices"
          - "$(SRCROOT)/Henge/Native"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lcompression"
